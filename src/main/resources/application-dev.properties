# ===================================================================
# CẤU HÌNH DATABASE MYSQL (MÔI TRƯỜNG DEV)
# ===================================================================

# 1. Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/nihon_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# 2. Cấu hình Hibernate JPA (tự động tạo bảng nếu chưa có)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Tự động nạp dữ liệu từ vựng tiếng Nhật từ file Markdown vào DB khi chạy lần đầu
nihon.import.auto-enabled=true

# 4. Tắt cache Thymeleaf để hot-reload giao diện
spring.thymeleaf.cache=false
