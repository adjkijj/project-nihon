# ===================================================================
# CẤU HÌNH MÔI TRƯỜNG PHÁT TRIỂN (DEV) - DATABASE H2
# ===================================================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:nihondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cấu hình Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console phục vụ kiểm tra dữ liệu cục bộ trong môi trường dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Tắt cache Thymeleaf trong dev để reload giao diện tức thì
spring.thymeleaf.cache=false
