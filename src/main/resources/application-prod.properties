# ===================================================================
# CẤU HÌNH MÔI TRƯỜNG PRODUCTION (PROD) - DATABASE MYSQL
# ===================================================================

# Cấu hình kết nối MySQL an toàn: Bắt buộc mã hóa TLS/SSL qua useSSL=true
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nihon_db}?useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:true}&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA cho Production
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Tuyệt đối tắt H2 Console trong production
spring.h2.console.enabled=false

# Bật bộ nhớ đệm Thymeleaf để tối ưu hiệu năng
spring.thymeleaf.cache=true

# Tắt tự động nạp file import trong production (tránh ghi đè/tải lại ngoài ý muốn)
nihon.import.auto-enabled=${NIHON_IMPORT_AUTO:false}

# Bảo mật thông tin lỗi: Tuyệt đối không để lộ stack trace, message hay binding errors ra ngoài
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ===================================================================
# CẤU HÌNH REVERSE PROXY & FORWARDED HEADERS (Nginx, Traefik, AWS ALB)
# ===================================================================
# Khi triển khai sau Reverse Proxy (TLS kết thúc tại proxy):
# Spring Boot dùng forwarded headers để nhận biết scheme thực tế (https) và client IP.
# Chỉ tin cậy các proxy headers từ proxy nội bộ được chỉ định.
server.forward-headers-strategy=framework
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_IPS:127\\.0\\.0\\.1|::1|10\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*|192\\.168\\..*}

# ===================================================================
# CẤU HÌNH TLS/HTTPS STANDALONE (Tùy chọn: Khi Spring Boot tự kết thúc TLS)
# ===================================================================
# Mặc định tắt (false) khi chạy sau Reverse Proxy. Đặt SSL_ENABLED=true nếu Spring Boot phục vụ HTTPS trực tiếp.
server.ssl.enabled=${SSL_ENABLED:false}
# Chỉ sử dụng giao thức TLS chuẩn hiện đại; TUYỆT ĐỐI KHÔNG dùng SSLv2, SSLv3, TLSv1.0, TLSv1.1
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
# Bộ cipher suite an toàn, loại trừ các cipher yếu, không an toàn
server.ssl.ciphers=TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384
# Private key, keystore path và mật khẩu nạp hoàn toàn qua BIẾN MÔI TRƯỜNG, TUYỆT ĐỐI KHÔNG lưu vào Git
server.ssl.key-store=${SSL_KEY_STORE_PATH:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:}

