spring.application.name=PROJECT NIHON

# Cấu hình Profile mặc định (Môi trường phát triển: dev)
spring.profiles.active=dev

# Bảo mật thông tin lỗi mặc định: Không để lộ stack trace hoặc cấu hình nội bộ
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
