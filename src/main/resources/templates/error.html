<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle != null ? errorTitle : (status != null ? status + ' - ' + (error != null ? error : 'Lỗi') : 'Đã xảy ra lỗi - Project Nihon')}">Thông báo lỗi - Project Nihon</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-badge">日</span>
            <span>Project Nihon</span>
        </a>
        <nav>
            <a href="/">Trang chủ</a>
            <a href="/vocabulary">Từ vựng</a>
            <a href="/topics">Chủ đề</a>
            <a href="/kanji">Kanji</a>
            <a href="/practice">Luyện tập</a>
            <a href="/stats">Thống kê</a>
        </nav>
    </header>

    <main>
        <div class="error-card">
            <div class="error-icon">⚠️</div>
            <h1 th:text="${errorTitle != null ? errorTitle : (status != null ? status + ' - ' + (error != null ? error : 'Lỗi') : 'Đã xảy ra sự cố')}">Đã xảy ra sự cố</h1>
            <p th:text="${errorMessage != null ? errorMessage : (message != null && !message.isBlank() ? message : 'Yêu cầu không thể xử lý vào lúc này. Vui lòng quay lại trang chủ và thử lại.')}">
                Yêu cầu không thể xử lý vào lúc này. Vui lòng quay lại trang chủ và thử lại.
            </p>
            <a href="/" class="btn-home">← Quay về Trang chủ</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Project Nihon. Hệ thống ghi nhớ từ vựng tiếng Nhật.</p>
    </footer>
</body>
</html>
