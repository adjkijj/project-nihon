<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa chủ đề' : 'Tạo chủ đề mới'} + ' - Project Nihon'">Tạo/Sửa chủ đề</title>
    <link rel="stylesheet" th:href="@{/css/topics-form.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-badge">日</span>
            <span>Project Nihon</span>
        </a>
        <nav class="u-7dbd1ca1">
            <a href="/">Trang chủ</a>
            <a href="/vocabulary">Từ vựng</a>
            <a href="/topics" class="active">Chủ đề</a>
            <a href="/kanji">Kanji</a>
            <a href="/practice">Luyện tập</a>
            <a href="/stats">Thống kê</a>
        </nav>
    </header>

    <main>
        <div class="form-card">
            <div class="form-header">
                <h1 th:text="${isEdit ? 'Chỉnh sửa chủ đề' : 'Tạo chủ đề mới'}">Tạo chủ đề</h1>
            </div>

            <form th:action="${isEdit ? '/topics/' + topicId + '/edit' : '/topics/new'}"
                  th:object="${form}" method="post">

                <input type="hidden" name="_csrf" th:value="${_csrf}">

                <div class="form-group">
                    <label for="name">Tên chủ đề <span class="required">*</span></label>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           placeholder="Ví dụ: 15. Đời sống gia đình"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="parentId">Chủ đề cha (Nếu là chủ đề con)</label>
                    <select id="parentId" th:field="*{parentId}" class="form-control"
                            th:classappend="${#fields.hasErrors('parentId')} ? 'is-invalid' : ''">
                        <option value="">-- Là chủ đề gốc (Cấp 1) --</option>
                        <option th:each="rt : ${rootTopics}"
                                th:value="${rt.id}"
                                th:text="${rt.name}">
                        </option>
                    </select>
                    <div class="field-hint">Để trống nếu đây là chủ đề chính cấp 1.</div>
                    <div th:if="${#fields.hasErrors('parentId')}" th:errors="*{parentId}" class="field-error"></div>
                </div>

                <div class="form-group u-margin-top-1-5rem">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{kanjiSection}">
                        <span>Thuộc khu vực học tập Kanji chuyên biệt</span>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="/topics" class="btn btn-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo chủ đề'}">Lưu</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
