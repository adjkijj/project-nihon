<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chủ đề - Project Nihon</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
        }
        nav a:hover, nav a.active {
            color: var(--text-primary);
            background-color: var(--border-color);
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-title h1 {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .page-title p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.55rem 1.1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--accent); color: #0f172a; }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
            padding: 0.35rem 0.75rem;
            font-size: 0.825rem;
        }
        .btn-danger:hover { background-color: var(--danger); color: #fff; }

        .btn-edit {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.3);
            padding: 0.35rem 0.75rem;
            font-size: 0.825rem;
        }
        .btn-edit:hover { background-color: var(--accent); color: #0f172a; }

        .alert {
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .alert-success {
            background-color: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }
        .alert-error {
            background-color: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .table-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(30, 41, 59, 0.7);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.825rem;
            text-transform: uppercase;
        }

        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.02); }

        .tag-subtopic {
            color: var(--accent);
            font-weight: 500;
            padding-left: 1.25rem;
        }

        .badge-kanji {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-normal {
            background-color: var(--border-color);
            color: var(--text-secondary);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-badge">日</span>
            <span>Project Nihon</span>
        </a>
        <nav style="display: flex; gap: 0.5rem; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch;">
            <a href="/">Trang chủ</a>
            <a href="/vocabulary">Từ vựng</a>
            <a href="/topics" class="active">Chủ đề</a>
            <a href="/kanji">Kanji</a>
            <a href="/practice">Luyện tập</a>
            <a href="/stats">Thống kê</a>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <div class="page-title">
                <h1>Quản lý chủ đề</h1>
                <p>Danh sách cấu trúc chủ đề và bài học trong hệ thống</p>
            </div>
            <a href="/topics/new" class="btn btn-primary">+ Tạo chủ đề mới</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <span>✓</span>
            <span th:text="${successMessage}">Thao tác thành công.</span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <span>⚠️</span>
            <span th:text="${errorMessage}">Đã xảy ra lỗi.</span>
        </div>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%;">ID</th>
                        <th style="width: 42%;">Tên chủ đề</th>
                        <th style="width: 25%;">Chủ đề cha</th>
                        <th style="width: 10%;">Phân loại</th>
                        <th style="width: 15%; text-align: right;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${topics}">
                        <td th:text="${t.id}" style="color: var(--text-muted); font-size: 0.8rem;">1</td>
                        <td>
                            <span th:if="${t.parent != null}" class="tag-subtopic">↳ <span th:text="${t.name}">Tên</span></span>
                            <span th:if="${t.parent == null}" style="font-weight: 700; color: #fff;" th:text="${t.name}">Tên</span>
                        </td>
                        <td>
                            <span th:if="${t.parent != null}" th:text="${t.parent.name}" style="color: var(--text-secondary); font-size: 0.85rem;">Cha</span>
                            <span th:if="${t.parent == null}" style="color: var(--text-muted); font-size: 0.8rem;">(Chủ đề gốc)</span>
                        </td>
                        <td>
                            <span th:if="${t.kanjiSection}" class="badge-kanji">Kanji</span>
                            <span th:if="${!t.kanjiSection}" class="badge-normal">Từ vựng</span>
                        </td>
                        <td>
                            <div class="actions-cell">
                                <a th:href="@{'/topics/' + ${t.id} + '/edit'}" class="btn btn-edit">Sửa</a>
                                <form th:action="@{'/topics/' + ${t.id} + '/delete'}" method="post"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa chủ đề này? Hệ thống sẽ ngăn chặn nếu chủ đề đang có từ vựng hoặc chủ đề con.');"
                                      style="margin: 0;">
                                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                                    <button type="submit" class="btn btn-danger">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
