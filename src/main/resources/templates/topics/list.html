<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chủ đề - Project Nihon</title>
    <link rel="stylesheet" th:href="@{/css/topics-list.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-badge">日</span>
            <span>Project Nihon</span>
        </a>
        <nav class="u-7dbd1ca1">
            <a href="/">Trang chủ</a>
            <a href="/vocabulary">Từ vựng</a>
            <a href="/topics" class="active">Chủ đề</a>
            <a href="/kanji">Kanji</a>
            <a href="/practice">Luyện tập</a>
            <a href="/stats">Thống kê</a>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <div class="page-title">
                <h1>Quản lý chủ đề</h1>
                <p>Danh sách cấu trúc chủ đề và bài học trong hệ thống</p>
            </div>
            <a href="/topics/new" class="btn btn-primary">+ Tạo chủ đề mới</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <span>✓</span>
            <span th:text="${successMessage}">Thao tác thành công.</span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <span>⚠️</span>
            <span th:text="${errorMessage}">Đã xảy ra lỗi.</span>
        </div>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="u-width-8pct">ID</th>
                        <th class="u-width-42pct">Tên chủ đề</th>
                        <th class="u-width-25pct">Chủ đề cha</th>
                        <th class="u-width-10pct">Phân loại</th>
                        <th class="u-width-15pct-text-align-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${topics}">
                        <td class="u-color-var-text-muted-font-size-0-8rem" th:text="${t.id}">1</td>
                        <td>
                            <span th:if="${t.parent != null}" class="tag-subtopic">↳ <span th:text="${t.name}">Tên</span></span>
                            <span class="u-font-weight-700-color-fff" th:if="${t.parent == null}" th:text="${t.name}">Tên</span>
                        </td>
                        <td>
                            <span class="u-color-var-text-secondary-font-size-0-85rem" th:if="${t.parent != null}" th:text="${t.parent.name}">Cha</span>
                            <span class="u-color-var-text-muted-font-size-0-8rem" th:if="${t.parent == null}">(Chủ đề gốc)</span>
                        </td>
                        <td>
                            <span th:if="${t.kanjiSection}" class="badge-kanji">Kanji</span>
                            <span th:if="${!t.kanjiSection}" class="badge-normal">Từ vựng</span>
                        </td>
                        <td>
                            <div class="actions-cell">
                                <a th:href="@{'/topics/' + ${t.id} + '/edit'}" class="btn btn-edit">Sửa</a>
                                <form class="u-margin-0" th:action="@{'/topics/' + ${t.id} + '/delete'}" method="post" data-confirm="Bạn có chắc chắn muốn xóa chủ đề này? Hệ thống sẽ ngăn chặn nếu chủ đề đang có từ vựng hoặc chủ đề con."
                                     >
                                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                                    <button type="submit" class="btn btn-danger">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
