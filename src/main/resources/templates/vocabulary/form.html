<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa từ vựng' : 'Thêm từ vựng mới'} + ' - Project Nihon'">Thêm/Sửa từ vựng</title>
    <link rel="stylesheet" th:href="@{/css/vocabulary-form.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-badge">日</span>
            <span>Project Nihon</span>
        </a>
        <nav class="u-7dbd1ca1">
            <a href="/">Trang chủ</a>
            <a href="/vocabulary" class="active">Từ vựng</a>
            <a href="/topics">Chủ đề</a>
            <a href="/kanji">Kanji</a>
            <a href="/practice">Luyện tập</a>
            <a href="/stats">Thống kê</a>
        </nav>
    </header>

    <main>
        <div class="form-card">
            <div class="form-header">
                <h1 th:text="${isEdit ? 'Chỉnh sửa từ vựng' : 'Thêm từ vựng mới'}">Thêm từ vựng</h1>
            </div>

            <form th:action="${isEdit ? '/vocabulary/' + vocabId + '/edit' : '/vocabulary/new'}"
                  th:object="${form}" method="post">

                <input type="hidden" name="_csrf" th:value="${_csrf}">

                <div class="form-group">
                    <label for="topicId">Chủ đề <span class="required">*</span></label>
                    <select id="topicId" th:field="*{topicId}" class="form-control"
                            th:classappend="${#fields.hasErrors('topicId')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn chủ đề --</option>
                        <option th:each="t : ${topics}"
                                th:value="${t.id}"
                                th:text="${t.parent != null ? '↳ ' + t.name : t.name}">
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('topicId')}" th:errors="*{topicId}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="japaneseText">Tiếng Nhật (Kanji/Kana) <span class="required">*</span></label>
                    <input type="text" id="japaneseText" th:field="*{japaneseText}" class="form-control"
                           placeholder="Ví dụ: 私（わたし） hoặc すみません"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('japaneseText')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('japaneseText')}" th:errors="*{japaneseText}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="reading">Cách đọc Hiragana</label>
                    <input type="text" id="reading" th:field="*{reading}" class="form-control"
                           placeholder="Ví dụ: わたし"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('reading')} ? 'is-invalid' : ''">
                    <div class="field-hint">Để trống nếu từ chỉ viết bằng Kana hoặc không có Furigana.</div>
                    <div th:if="${#fields.hasErrors('reading')}" th:errors="*{reading}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="romaji">Romaji <span class="required">*</span></label>
                    <input type="text" id="romaji" th:field="*{romaji}" class="form-control"
                           placeholder="Ví dụ: watashi"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('romaji')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('romaji')}" th:errors="*{romaji}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="meaningVi">Nghĩa tiếng Việt <span class="required">*</span></label>
                    <input type="text" id="meaningVi" th:field="*{meaningVi}" class="form-control"
                           placeholder="Ví dụ: Tôi"
                           maxlength="500"
                           th:classappend="${#fields.hasErrors('meaningVi')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('meaningVi')}" th:errors="*{meaningVi}" class="field-error"></div>
                </div>

                <div class="form-actions">
                    <a href="/vocabulary" class="btn btn-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo từ vựng'}">Lưu</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
