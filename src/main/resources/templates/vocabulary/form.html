<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa từ vựng' : 'Thêm từ vựng mới'} + ' - Project Nihon'">Thêm/Sửa từ vựng</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --danger: #ef4444;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
        }
        nav a:hover, nav a.active {
            color: var(--text-primary);
            background-color: var(--border-color);
        }

        main {
            flex: 1;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .form-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .form-header {
            margin-bottom: 1.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .required { color: #f87171; }

        .form-control {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .form-control.is-invalid {
            border-color: var(--danger);
        }

        .field-error {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 0.35rem;
        }

        .field-hint {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--accent); color: #0f172a; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: var(--border-color); color: var(--text-primary); }
        .btn-secondary:hover { background-color: #475569; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-badge">日</span>
            <span>Project Nihon</span>
        </a>
        <nav style="display: flex; gap: 0.5rem; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch;">
            <a href="/">Trang chủ</a>
            <a href="/vocabulary" class="active">Từ vựng</a>
            <a href="/topics">Chủ đề</a>
            <a href="/kanji">Kanji</a>
            <a href="/practice">Luyện tập</a>
            <a href="/stats">Thống kê</a>
        </nav>
    </header>

    <main>
        <div class="form-card">
            <div class="form-header">
                <h1 th:text="${isEdit ? 'Chỉnh sửa từ vựng' : 'Thêm từ vựng mới'}">Thêm từ vựng</h1>
            </div>

            <form th:action="${isEdit ? '/vocabulary/' + vocabId + '/edit' : '/vocabulary/new'}"
                  th:object="${form}" method="post">

                <input type="hidden" name="_csrf" th:value="${_csrf}">

                <div class="form-group">
                    <label for="topicId">Chủ đề <span class="required">*</span></label>
                    <select id="topicId" th:field="*{topicId}" class="form-control"
                            th:classappend="${#fields.hasErrors('topicId')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn chủ đề --</option>
                        <option th:each="t : ${topics}"
                                th:value="${t.id}"
                                th:text="${t.parent != null ? '↳ ' + t.name : t.name}">
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('topicId')}" th:errors="*{topicId}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="japaneseText">Tiếng Nhật (Kanji/Kana) <span class="required">*</span></label>
                    <input type="text" id="japaneseText" th:field="*{japaneseText}" class="form-control"
                           placeholder="Ví dụ: 私（わたし） hoặc すみません"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('japaneseText')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('japaneseText')}" th:errors="*{japaneseText}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="reading">Cách đọc Hiragana</label>
                    <input type="text" id="reading" th:field="*{reading}" class="form-control"
                           placeholder="Ví dụ: わたし"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('reading')} ? 'is-invalid' : ''">
                    <div class="field-hint">Để trống nếu từ chỉ viết bằng Kana hoặc không có Furigana.</div>
                    <div th:if="${#fields.hasErrors('reading')}" th:errors="*{reading}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="romaji">Romaji <span class="required">*</span></label>
                    <input type="text" id="romaji" th:field="*{romaji}" class="form-control"
                           placeholder="Ví dụ: watashi"
                           maxlength="255"
                           th:classappend="${#fields.hasErrors('romaji')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('romaji')}" th:errors="*{romaji}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="meaningVi">Nghĩa tiếng Việt <span class="required">*</span></label>
                    <input type="text" id="meaningVi" th:field="*{meaningVi}" class="form-control"
                           placeholder="Ví dụ: Tôi"
                           maxlength="500"
                           th:classappend="${#fields.hasErrors('meaningVi')} ? 'is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('meaningVi')}" th:errors="*{meaningVi}" class="field-error"></div>
                </div>

                <div class="form-actions">
                    <a href="/vocabulary" class="btn btn-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo từ vựng'}">Lưu</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
